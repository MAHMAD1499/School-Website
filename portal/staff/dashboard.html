<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Staff Dashboard — KSM School Portal">
  <title>Staff Dashboard — KSM Portal</title>
  <link rel="stylesheet" href="../assets/portal.css">
  <style>
    .quick-action { display:flex;align-items:center;gap:0.75rem;padding:0.9rem 1rem;background:var(--primary-bg);border-radius:var(--radius-sm);text-decoration:none;color:var(--text-dark);transition:var(--transition);font-weight:500;font-size:0.9rem;border:1px solid rgba(59,130,246,0.15); }
    .quick-action:hover { background:var(--primary-deep);color:white;transform:translateX(4px); }
    .quick-action:hover .qa-icon { background:rgba(255,255,255,0.2); }
    .qa-icon { width:36px;height:36px;background:var(--primary-deep);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;transition:var(--transition); }
  </style>
</head>
<body>
<div class="portal-wrapper">
  <div class="portal-main">
    <div class="portal-topbar">
      <div class="topbar-left">
        <button class="menu-toggle" id="menuToggle">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span class="topbar-title">Staff Dashboard</span>
      </div>
      <div class="topbar-right">
        <span id="staffNameTopbar" style="font-size:0.82rem;color:var(--text-medium);"></span>
        <div class="topbar-avatar" style="background:#10B981;color:white;" id="staffAvatar">S</div>
        <button class="btn btn-sm btn-danger" onclick="doLogout()">Logout</button>
      </div>
    </div>

    <div class="portal-content fade-up">
      <!-- Welcome Banner -->
      <div style="background:linear-gradient(135deg,#065F46,#10B981);border-radius:var(--radius-lg);padding:1.75rem 2rem;color:white;margin-bottom:2rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;">
        <div>
          <h1 style="color:white;font-size:1.5rem;margin-bottom:0.3rem;" id="welcomeMsg">Welcome, Teacher 👋</h1>
          <p style="color:rgba(255,255,255,0.75);font-size:0.9rem;">Manage your classes, homework and attendance from here.</p>
        </div>
        <div style="display:flex;gap:0.75rem;flex-wrap:wrap;">
          <a href="../index.html" class="btn btn-outline" style="border-color:rgba(255,255,255,0.5);color:white;font-size:0.85rem;">View Portal</a>
        </div>
      </div>

      <!-- Stats -->
      <div class="stats-grid" id="staffStats"></div>

      <!-- Quick Actions + Class Info -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-top:0.5rem;" class="staff-cols">
        <div class="card">
          <div class="card-header"><h2 class="card-title">⚡ Quick Actions</h2></div>
          <div style="display:flex;flex-direction:column;gap:0.5rem;">
            <a href="homework.html" class="quick-action"><div class="qa-icon">📋</div>Assign Homework</a>
            <a href="attendance.html" class="quick-action"><div class="qa-icon">✅</div>Mark Attendance</a>
            <a href="profile.html" class="quick-action"><div class="qa-icon">👤</div>Edit My Profile</a>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><h2 class="card-title">📚 My Class Students</h2></div>
          <div id="classStudents"></div>
        </div>
      </div>
    </div>
    <div class="portal-footer">© 2026 Kindergarten Saadia's Montessori School. All rights reserved.</div>
  </div>
</div>

<script src="../assets/portal.js"></script>
<script src="../assets/sidebar.js"></script>
<script>
  buildSidebar('staff');

  document.addEventListener('DOMContentLoaded', () => {
    const staff = Auth.getStaff();
    if (!staff) { window.location.href = 'login.html'; return; }

    // Set topbar info
    document.getElementById('staffNameTopbar').textContent = staff.name;
    document.getElementById('staffAvatar').textContent = staff.name.charAt(0).toUpperCase();
    document.getElementById('welcomeMsg').textContent = `Welcome, ${staff.name} 👋`;

    // Stats
    const homework = DB.get('homework');
    const attendance = DB.get('attendance');
    const students = DB.get('students');
    const myHomework = homework.filter(h => h.staffId === staff.id);
    const myAttendance = attendance.filter(a => a.staffId === staff.id);
    const myStudents = students.filter(s => s.class === staff.class);

    document.getElementById('staffStats').innerHTML = `
      <div class="stat-card"><div class="stat-icon green"><svg viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg></div><div class="stat-info"><div class="stat-number">${myHomework.length}</div><div class="stat-label">Homework Assigned</div></div></div>
      <div class="stat-card"><div class="stat-icon blue"><svg viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div><div class="stat-info"><div class="stat-number">${myAttendance.length}</div><div class="stat-label">Attendance Records</div></div></div>
      <div class="stat-card"><div class="stat-icon gold"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div><div class="stat-info"><div class="stat-number">${myStudents.length}</div><div class="stat-label">My Students</div></div></div>
      <div class="stat-card"><div class="stat-icon purple"><svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></div><div class="stat-info"><div class="stat-number">${staff.subject}</div><div class="stat-label">Subject</div></div></div>
    `;

    // Class students
    const el = document.getElementById('classStudents');
    if (myStudents.length === 0) {
      el.innerHTML = '<div class="empty-state" style="padding:2rem;"><div class="empty-state-icon">📚</div><p>No students in your class yet.</p></div>';
    } else {
      el.innerHTML = myStudents.map(s => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:0.65rem 0;border-bottom:1px solid var(--border-color);">
          <div>
            <p style="font-weight:600;font-size:0.88rem;">${s.name}</p>
            <p style="font-size:0.75rem;color:var(--text-medium);">${s.rollNo} — ${s.class}</p>
          </div>
          <span class="badge badge-blue">${s.class}</span>
        </div>
      `).join('');
    }
  });

  function doLogout() {
    Auth.logoutStaff();
    window.location.href = 'login.html';
  }
</script>
<style>
  @media(max-width:700px){ .staff-cols{grid-template-columns:1fr!important;} }
</style>
</body>
</html>
