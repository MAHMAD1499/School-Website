<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse the dynamic photo gallery of Kindergarten Saadia's Montessori School activities and events.">
  <title>Gallery — KSM Portal</title>
  <link rel="stylesheet" href="assets/portal.css">
</head>
<body>
<div class="portal-wrapper">
  <div class="portal-main">
    <div class="portal-topbar">
      <div class="topbar-left">
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle Menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span class="topbar-title">Photo Gallery</span>
      </div>
      <div class="topbar-right">
        <div class="topbar-avatar">K</div>
      </div>
    </div>

    <div class="portal-content fade-up">
      <div class="page-header">
        <div class="page-header-left">
          <h1 class="page-title">🖼️ Photo Gallery</h1>
          <p class="page-subtitle">Capturing moments of learning, play, and growth</p>
        </div>
      </div>

      <div id="galleryGrid" class="gallery-grid"></div>
    </div>

    <div class="portal-footer">© 2026 Kindergarten Saadia's Montessori School. All rights reserved.</div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">✕</button>
  <img src="" alt="" id="lightboxImg">
  <div class="lightbox-caption" id="lightboxCaption"></div>
</div>

<script src="assets/portal.js"></script>
<script src="assets/sidebar.js"></script>
<script>
  buildSidebar('portal');

  function renderGallery() {
    const gallery = DB.get('gallery');
    const grid = document.getElementById('galleryGrid');

    if (gallery.length === 0) {
      grid.innerHTML = `<div class="empty-state" style="column-span:all"><div class="empty-state-icon">🖼️</div><div class="empty-state-title">No photos yet</div><p class="empty-state-text">Gallery photos will appear here once added by admin.</p></div>`;
      return;
    }

    grid.innerHTML = gallery.map((item, i) => `
      <div class="gallery-item" data-index="${i}" onclick="openLightbox(${i})">
        <img src="${item.url}" alt="${item.caption || 'Gallery photo'}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x300/EFF6FF/1E3A8A?text=Photo'">
        <div class="gallery-item-caption">${item.caption || ''}</div>
      </div>
    `).join('');
  }

  function openLightbox(index) {
    const gallery = DB.get('gallery');
    const item = gallery[index];
    if (!item) return;
    document.getElementById('lightboxImg').src = item.url;
    document.getElementById('lightboxImg').alt = item.caption || '';
    document.getElementById('lightboxCaption').textContent = item.caption || '';
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  document.getElementById('lightboxClose').addEventListener('click', () => {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  });

  document.getElementById('lightbox').addEventListener('click', e => {
    if (e.target === document.getElementById('lightbox')) {
      document.getElementById('lightbox').classList.remove('open');
      document.body.style.overflow = '';
    }
  });

  document.addEventListener('DOMContentLoaded', renderGallery);
</script>
</body>
</html>
